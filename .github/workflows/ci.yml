name: Quality
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
      - name: Stage cPanel release
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release-payload
          cp -R .next public release-payload/
          rm -rf release-payload/.next/cache release-payload/.next/dev
          cp package.json package-lock.json server.js next.config.mjs release-payload/
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: cpanel-release
          path: release-payload/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Deploy to cPanel
    needs: quality
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    concurrency:
      group: cpanel-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cpanel-release
          path: release-payload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upload tested release
        env:
          FTP_SERVER_VGATE: ${{ secrets.FTP_SERVER_VGATE }}
          FTP_USERNAME_VGATE: ${{ secrets.FTP_USERNAME_VGATE }}
          FTP_PASSWORD_VGATE: ${{ secrets.FTP_PASSWORD_VGATE }}
          CPANEL_DIR_VGATE: ${{ secrets.CPANEL_DIR_VGATE }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_TLS_VERIFY: ${{ vars.FTP_TLS_VERIFY || 'false' }}
          FTP_CA_CERT: ${{ secrets.FTP_CA_CERT }}
          CPANEL_AUTO_RESTART: ${{ vars.CPANEL_AUTO_RESTART }}
        run: python scripts/deploy-cpanel.py
      - name: Deployment summary
        run: |
          echo '### cPanel upload completed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only the tested release payload was uploaded. FTP cannot install dependencies or run migrations.' >> "$GITHUB_STEP_SUMMARY"
          echo 'If package dependencies changed, run NPM Install in cPanel. For API schema changes, back up and run migrations before restarting.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Restart in cPanel unless CPANEL_AUTO_RESTART=true is configured and host prerequisites are already satisfied.' >> "$GITHUB_STEP_SUMMARY"
