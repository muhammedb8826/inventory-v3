name: SSH release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
        env:
          API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
      - name: Prepare release
        run: tar -czf /tmp/release.tgz .next public package.json package-lock.json server.js next.config.mjs scripts
      - name: Deploy using verified SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          [[ "$DEPLOY_ROOT" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_ROOT" != / ]] || exit 2
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ && "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || exit 2
          [[ "$HEALTH_URL" =~ ^https://[a-zA-Z0-9./_-]+$ ]] || exit 2
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          scp -o StrictHostKeyChecking=yes /tmp/release.tgz "$SSH_USER@$SSH_HOST:$DEPLOY_ROOT/incoming-$GITHUB_SHA.tgz"
          ssh -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "DEPLOY_ROOT='$DEPLOY_ROOT' RELEASE_ID='$GITHUB_SHA' HEALTH_URL='$HEALTH_URL' bash -s" < scripts/deploy-release.sh
